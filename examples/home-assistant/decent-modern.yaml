          icon: mdi:history
          styles: |
            .bubble-name { color: #a6a6a6; font-size: 12px !important; font-weight: 400 !important; white-space: pre-line !important; line-height: 1.5; }
            .bubble-separator { min-height: 44px; }
            ${(() => { const el = card.querySelector('.bubble-name'); if (!el) return ''; const raw = hass.states['sensor.decent_espresso_de1_de1_shot_started_at']?.state; const date = new Date(raw ?? ''); const valid = Number.isFinite(date.getTime()); const when = valid ? new Intl.DateTimeFormat('de-DE', {timeZone: hass.config?.time_zone || 'Europe/Berlin', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'}).format(date) : ''; const profile = hass.states['sensor.decent_espresso_de1_de1_shot_profile']?.state; el.textContent = 'Letzter Bezug' + (when ? ' · ' + when : '') + (profile && !['unknown','unavailable'].includes(profile) ? '\n' + profile : ''); return ''; })()}
            .bubble-line { background: #a6a6a6; opacity: .12; }
            .bubble-icon { color: #a6a6a6 !important; --mdc-icon-size: 16px; }
        - type: custom:bubble-card
          card_type: sub-buttons
          rows: 1
          sub_button:
            bottom:
              - group:
                  - entity: sensor.decent_espresso_de1_de1_shot_weight
                    name: Ergebnis
                    show_name: true
                    show_icon: false
                    show_state: false
                    show_background: false
                    fill_width: true
                    tap_action:
                      action: more-info
                  - entity: sensor.decent_espresso_de1_de1_shot_duration
                    name: Dauer
                    show_name: true
                    show_icon: false
                    show_state: false
                    show_background: false
                    fill_width: true
                    tap_action:
                      action: more-info
                  - entity: sensor.decent_espresso_de1_de1_last_shot_stop_reason
                    name: Ende
                    show_name: true
                    show_icon: false
                    show_state: false
                    show_background: false
                    fill_width: true
                    tap_action:
                      action: more-info
                buttons_layout: inline
                justify_content: fill
            bottom_layout: rows
          styles: |
            ha-card { --bubble-main-background-color: #202020; --bubble-border-radius: 14px; --bubble-border: none; --bubble-box-shadow: none; --bubble-sub-button-background-color: transparent; color: #e5e5e5; }
            .bubble-container { height: 60px !important; min-height: 0 !important; }
            .bubble-sub-button-bottom-container { top: 0 !important; bottom: 0 !important; height: 100% !important; margin: 0 8px !important; gap: 0 !important; align-items: stretch !important; }
            .bubble-sub-button-group { width: 100%; height: 52px !important; margin: 0 !important; }
            .bubble-sub-button-group > .bubble-sub-button { flex: 1 1 0 !important; width: 0 !important; min-width: 0; }
            .bubble-sub-button-group > .bubble-sub-button:not(:last-child) { border-right: 1px solid #343434; }
            .bubble-sub-button { background: transparent !important; box-shadow: none !important; border-radius: 0; height: 52px !important; padding: 2px 4px !important; }
            .bubble-sub-button-name-container { white-space: pre-line !important; text-align: center; font-size: 12px !important; font-weight: 400 !important; line-height: 1.5; color: #e5e5e5; font-variant-numeric: tabular-nums; }
            ${(() => { const el = card.querySelector('.bubble-sub-button-1 .bubble-sub-button-name-container'); if (!el) return ''; const raw = hass.states['sensor.decent_espresso_de1_de1_shot_weight']?.state; const n = Number(raw); el.textContent = 'Ergebnis\n' + (raw != null && raw.trim() !== '' && Number.isFinite(n) && n >= 0 ? n.toLocaleString('de-DE', {minimumFractionDigits: 1, maximumFractionDigits: 1}) + ' g' : '—'); return ''; })()}
            ${(() => { const el = card.querySelector('.bubble-sub-button-2 .bubble-sub-button-name-container'); if (!el) return ''; const raw = hass.states['sensor.decent_espresso_de1_de1_shot_duration']?.state; const n = Number(raw); el.textContent = 'Dauer\n' + (raw != null && raw.trim() !== '' && Number.isFinite(n) ? n.toLocaleString('de-DE', {minimumFractionDigits: 1, maximumFractionDigits: 1}) + ' s' : '—'); return ''; })()}
            ${(() => { const el = card.querySelector('.bubble-sub-button-3 .bubble-sub-button-name-container'); if (!el) return ''; const raw = hass.states['sensor.decent_espresso_de1_de1_last_shot_stop_reason']?.state; el.textContent = 'Ende\n' + (({targetWeight:'Zielgewicht',targetVolume:'Zielvolumen',machineEnded:'Profilende',apiStop:'HA gestoppt',appStop:'Tablet gestoppt',scaleLost:'Waage verloren',disconnected:'Verbindung weg',error:'Fehler'})[raw] ?? (raw && !['unknown','unavailable'].includes(raw) ? raw.replace(/_/g, ' ') : '—')); return ''; })()}

  - type: conditional
    conditions:
      - condition: state
        entity: switch.socketzigbee_5
        state: 'on'
      - condition: state
        entity: binary_sensor.decent_espresso_de1_de1_scale_lost_during_shot
