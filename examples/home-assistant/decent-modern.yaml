            .bubble-sub-button-group > .bubble-sub-button { flex: 1 1 0 !important; width: 0 !important; min-width: 0; }
            .bubble-sub-button { background: transparent !important; box-shadow: none !important; border-radius: 0; height: auto !important; padding: 5px 4px !important; }
