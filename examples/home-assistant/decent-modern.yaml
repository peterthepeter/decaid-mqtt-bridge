type: custom:bubble-card
card_type: pop-up
popup_mode: adaptive-dialog
with_bottom_offset: true
hash: '#decent'
name: Decent DE1 XXL
icon: mdi:coffee-maker-outline
show_header: true
width_desktop: 440px
bg_color: '#191919'
bg_opacity: '100'
styles: |
  ha-card {
    --bubble-pop-up-border-radius: 18px;
    --bubble-pop-up-background-color: #191919;
    --bubble-main-background-color: #202020;
    --bubble-icon-background-color: transparent;
    --bubble-accent-color: #e5e5e5;
    --primary-text-color: #e5e5e5;
    --secondary-text-color: #a6a6a6;
    --vertical-stack-card-gap: 8px;
  }
  .bubble-name { font-size: 13px !important; font-weight: 400 !important; }
  .bubble-icon { color: #e5e5e5 !important; }
  .bubble-button-card-container, .bubble-button-background { border-radius: 14px !important; }
  .bubble-close-button { border-radius: 14px !important; }
  .bubble-icon-container {
    width: 32px !important;
    min-width: 32px !important;
    height: 32px !important;
    border-radius: 0 !important;
    background: transparent !important;
  }
  ha-card { --bubble-border-radius: 14px; }
cards:
  - type: horizontal-stack
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: switch
        entity: switch.socketzigbee_5
        name: Netzstrom
        icon: mdi:power-socket-de
        show_state: true
        scrolling_effect: false
        tap_action:
          action: toggle
          confirmation:
            text: Netzstrom der Espressomaschine wirklich umschalten?
        double_tap_action:
          action: more-info
        hold_action:
          action: more-info
        styles: |
          ha-card {
            --bubble-main-background-color: #202020;
            --bubble-border-radius: 14px;
            --bubble-border: none;
            --bubble-box-shadow: none;
            --primary-text-color: #e5e5e5;
            --secondary-text-color: #a6a6a6;
          }
          .bubble-button-background { opacity: 1 !important; background: #202020 !important; }
          .bubble-button-card-container { height: 44px !important; min-height: 44px !important; }
          .bubble-icon-container {
            width: 30px !important;
            min-width: 30px !important;
            height: 30px !important;
            margin-left: 10px !important;
            border-radius: 9px !important;
            background: transparent !important;
          }
          .bubble-icon {
            --mdc-icon-size: 18px;
            color: ${hass.states['switch.socketzigbee_5']?.state === 'on' ? '#d98b83' : '#e5e5e5'} !important;
          }
          .bubble-name-container {
            display: flex !important;
            flex-direction: row !important;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex: 1;
            min-width: 0;
            margin: 10px 14px 10px 8px !important;
          }
          .bubble-name { color: #a6a6a6 !important; font-size: 13px !important; font-weight: 400 !important; }
          .bubble-state { color: #e5e5e5 !important; font-size: 13px !important; opacity: 1 !important; text-align: right; }
          ${(() => { const el = card.querySelector('.bubble-state'); if (el) el.textContent = hass.states['switch.socketzigbee_5']?.state === 'on' ? 'Ein' : 'Aus'; return ''; })()}
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.decent_espresso_de1_de1_tablet_battery
        name: Tablet-Akku
        icon: mdi:tablet-cellphone
        show_state: true
        scrolling_effect: false
        tap_action:
          action: more-info
        hold_action:
          action: more-info
        styles: |
          ha-card {
            --bubble-main-background-color: #202020;
            --bubble-border-radius: 14px;
            --bubble-border: none;
            --bubble-box-shadow: none;
            --primary-text-color: #e5e5e5;
            --secondary-text-color: #a6a6a6;
          }
          .bubble-button-background { opacity: 1 !important; background: #202020 !important; }
          .bubble-button-card-container { height: 44px !important; min-height: 44px !important; }
          .bubble-icon-container {
            width: 30px !important;
            min-width: 30px !important;
            height: 30px !important;
            margin-left: 10px !important;
            border-radius: 9px !important;
            background: transparent !important;
          }
          .bubble-icon {
            --mdc-icon-size: 18px;
            color: ${(() => { const raw = hass.states['sensor.decent_espresso_de1_de1_tablet_battery']?.state; const n = Number(raw); return raw == null || raw.trim() === '' || !Number.isFinite(n) ? '#a6a6a6' : n < 15 ? '#d98b83' : n < 30 ? '#d6c49b' : '#a8c99f'; })()} !important;
          }
          .bubble-name-container {
            display: flex !important;
            flex-direction: row !important;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex: 1;
            min-width: 0;
            margin: 10px 14px 10px 8px !important;
          }
          .bubble-name { color: #a6a6a6 !important; font-size: 13px !important; font-weight: 400 !important; }
          .bubble-state { color: #e5e5e5 !important; font-size: 13px !important; opacity: 1 !important; text-align: right; font-variant-numeric: tabular-nums; }

  - type: conditional
    conditions:
      - condition: state
        entity: switch.socketzigbee_5
        state: 'on'
    card:
      type: custom:bubble-card
      card_type: button
      button_type: state
