            ${(() => { const el = card.querySelector('.bubble-sub-button-1 .bubble-sub-button-name-container'); if (!el) return ''; const value = id => { const raw = hass.states[id]?.state; const n = Number(raw); return raw != null && raw.trim() !== '' && Number.isFinite(n) ? n : null; }; const ml = value('sensor.decent_espresso_de1_de1_water_level'); const mm = value('sensor.decent_espresso_de1_de1_water_level_height'); const threshold = value('sensor.decent_espresso_de1_de1_refill_threshold'); el.textContent = 'Tank\n' + (ml == null ? '—' : ml.toLocaleString('de-DE', {maximumFractionDigits: 0}) + ' mL') + (mm == null ? '' : ' · ' + mm.toLocaleString('de-DE', {minimumFractionDigits: 1, maximumFractionDigits: 1}) + ' mm'); el.style.setProperty('color', mm != null && threshold != null && mm <= threshold ? '#d98b83' : '#e5e5e5', 'important'); return ''; })()}
            ${(() => { const el = card.querySelector('.bubble-sub-button-2 .bubble-sub-button-name-container'); if (!el) return ''; const raw = hass.states['sensor.decent_espresso_de1_de1_refill_threshold']?.state; const n = Number(raw); el.textContent = 'Nachfüllen bei\n' + (raw != null && raw.trim() !== '' && Number.isFinite(n) ? n.toLocaleString('de-DE', {minimumFractionDigits: 1, maximumFractionDigits: 1}) + ' mm' : '—'); el.style.setProperty('color', '#d6c49b', 'important'); return ''; })()}
            ${(() => { const el = card.querySelector('.bubble-sub-button-3 .bubble-sub-button-name-container'); if (!el) return ''; const fmt = id => { const raw = hass.states[id]?.state; const n = Number(raw); return raw != null && raw.trim() !== '' && Number.isFinite(n) ? n.toLocaleString('de-DE', {minimumFractionDigits: 1, maximumFractionDigits: 1}) + ' °C' : '—'; }; el.textContent = 'Brühgruppe\n' + fmt('sensor.decent_espresso_de1_de1_head_temperature') + ' · Ziel ' + fmt('sensor.decent_espresso_de1_de1_target_group_temperature'); return ''; })()}
            ${(() => { const el = card.querySelector('.bubble-sub-button-4 .bubble-sub-button-name-container'); if (!el) return ''; if (hass.states['switch.decent_espresso_de1_de1_steam_heater_on']?.state !== 'on') { el.textContent = 'Dampf\nAus'; return ''; } const fmt = id => { const raw = hass.states[id]?.state; const n = Number(raw); return raw != null && raw.trim() !== '' && Number.isFinite(n) ? n.toLocaleString('de-DE', {maximumFractionDigits: 0}) + ' °C' : '—'; }; el.textContent = 'Dampf\n' + fmt('sensor.decent_espresso_de1_de1_steam_temperature') + ' · Ziel ' + fmt('sensor.decent_espresso_de1_de1_target_steam_temperature'); return ''; })()}
