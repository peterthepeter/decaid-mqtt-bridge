            ha-card { --bubble-main-background-color: #202020; --bubble-border-radius: 14px; --bubble-border: none; --bubble-box-shadow: none; color: #e5e5e5; }
            .bubble-select-card-container { background: #202020 !important; min-height: 48px; }
            .bubble-icon-container { background: transparent !important; border-radius: 9px !important; }
            .bubble-icon { color: #e5e5e5 !important; --mdc-icon-size: 18px; }
            .bubble-name { color: #a6a6a6 !important; font-size: 13px !important; font-weight: 400 !important; }
            .bubble-state { color: #e5e5e5 !important; font-size: 13px !important; opacity: 1 !important; }
        - type: custom:bubble-card
