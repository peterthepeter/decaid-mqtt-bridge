        - type: custom:bubble-card
          card_type: sub-buttons
          rows: 3
          sub_button:
            bottom:
              - group:
                  - entity: sensor.decent_espresso_de1_de1_water_level
                    name: Tank
                    show_name: true
                    show_icon: false
                    show_state: false
                    show_background: false
                    fill_width: true
                    tap_action:
                      action: more-info
                  - entity: sensor.decent_espresso_de1_de1_refill_threshold
                    name: Nachfüllen bei
                    show_name: true
                    show_icon: false
                    show_state: false
                    show_background: false
                    fill_width: true
                    tap_action:
                      action: more-info
                buttons_layout: inline
                justify_content: fill
              - group:
                  - entity: sensor.decent_espresso_de1_de1_head_temperature
                    name: Brühgruppe
