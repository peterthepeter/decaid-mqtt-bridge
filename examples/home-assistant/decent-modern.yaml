            ${(() => { const el = card.querySelector('.bubble-sub-button-6 .bubble-sub-button-name-container'); if (!el) return ''; const raw = hass.states['sensor.decent_espresso_de1_de1_scale_battery']?.state; const n = Number(raw); el.textContent = 'Waagen-Akku\n' + (raw != null && raw.trim() !== '' && Number.isFinite(n) ? n.toLocaleString('de-DE', {maximumFractionDigits: 0}) + ' %' : '—'); el.style.setProperty('color', !Number.isFinite(n) ? '#a6a6a6' : n < 15 ? '#d98b83' : n < 30 ? '#d6c49b' : '#e5e5e5', 'important'); return ''; })()}

