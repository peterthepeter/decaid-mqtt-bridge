                    fill_width: true
                    tap_action:
                      action: more-info
                buttons_layout: inline
                justify_content: fill
            bottom_layout: rows
          styles: |
            ha-card { --bubble-main-background-color: #202020; --bubble-border-radius: 14px; --bubble-border: none; --bubble-box-shadow: none; --bubble-sub-button-background-color: transparent; color: #e5e5e5; }
            .bubble-container { height: 52px !important; min-height: 0 !important; }
            .bubble-sub-button-bottom-container { top: 0 !important; bottom: 0 !important; height: 100% !important; margin: 0 8px !important; gap: 0 !important; align-items: stretch !important; }
            .bubble-sub-button-group { width: 100%; height: 44px !important; margin: 0 !important; }
            .bubble-sub-button-group > .bubble-sub-button:not(:last-child) { border-right: 1px solid #343434; }
            .bubble-sub-button { background: transparent !important; box-shadow: none !important; border-radius: 0; height: 44px !important; padding: 2px 8px !important; }
            .bubble-sub-button-name-container { white-space: pre-line !important; text-align: center; font-size: 13px !important; font-weight: 400 !important; line-height: 1.5; color: #e5e5e5; font-variant-numeric: tabular-nums; }
            ${(() => { const el = card.querySelector('.bubble-sub-button-1 .bubble-sub-button-name-container'); if (!el) return ''; const raw = hass.states['sensor.decent_espresso_de1_de1_target_dose']?.state; const n = Number(raw); el.textContent = 'Dosis\n' + (raw != null && raw.trim() !== '' && Number.isFinite(n) ? n.toLocaleString('de-DE', {minimumFractionDigits: 1, maximumFractionDigits: 1}) + ' g' : '—'); return ''; })()}
            ${(() => { const el = card.querySelector('.bubble-sub-button-2 .bubble-sub-button-name-container'); if (!el) return ''; const raw = hass.states['sensor.decent_espresso_de1_de1_target_yield']?.state; const n = Number(raw); el.textContent = 'Zielmenge\n' + (raw != null && raw.trim() !== '' && Number.isFinite(n) ? n.toLocaleString('de-DE', {minimumFractionDigits: 1, maximumFractionDigits: 1}) + ' g' : '—'); return ''; })()}

  - type: conditional
    conditions:
      - condition: state
        entity: switch.socketzigbee_5
        state: 'on'
      - condition: state
        entity: binary_sensor.decent_espresso_de1_de1_machine_connected
