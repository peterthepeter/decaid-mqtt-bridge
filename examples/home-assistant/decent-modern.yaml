        ha-card {
          --bubble-main-background-color: #202020;
          --bubble-border-radius: 14px;
          --bubble-border: none;
          --bubble-box-shadow: none;
          color: #e5e5e5;
        }
        .bubble-button-card-container { background: #202020 !important; min-height: 48px; }
        .bubble-icon-container {
          width: 30px !important;
          min-width: 30px !important;
          height: 30px !important;
          margin-left: 10px !important;
          border-radius: 9px !important;
          background: transparent !important;
        }
        .bubble-icon {
          --mdc-icon-size: 18px;
          color: ${(() => { const connected = hass.states['binary_sensor.decent_espresso_de1_de1_machine_connected']?.state === 'on'; const s = hass.states['sensor.decent_espresso_de1_de1_state']?.state; const sub = hass.states['sensor.decent_espresso_de1_de1_substate']?.state; if (!connected || s === 'FatalError') return '#d98b83'; if (s === 'Refill' || (s === 'Idle' && sub === 'heating')) return '#d6c49b'; if (['Espresso','Steam','HotWater','HotWaterRinse','SteamRinse'].includes(s)) return '#e5e5e5'; if (s === 'Idle' && sub === 'ready') return '#a8c99f'; return '#a6a6a6'; })()} !important;
        }
        .bubble-name-container { flex: 1; min-width: 0; margin: 10px 4px 10px 8px !important; }
        .bubble-state { color: #e5e5e5 !important; font-size: 13px !important; opacity: 1 !important; text-align: left; }
        ${(() => { const el = card.querySelector('.bubble-state'); if (!el) return ''; const connected = hass.states['binary_sensor.decent_espresso_de1_de1_machine_connected']?.state === 'on'; const s = hass.states['sensor.decent_espresso_de1_de1_state']?.state; const sub = hass.states['sensor.decent_espresso_de1_de1_substate']?.state; if (!connected) el.textContent = 'Nicht verbunden'; else if (s === 'Idle' && sub === 'heating') el.textContent = 'Heizt auf'; else if (s === 'Idle' && sub === 'ready') el.textContent = 'Bereit'; else el.textContent = ({Init:'Startet',Busy:'Beschäftigt',Idle:'Bereit',SchedIdle:'Wartet',Sleep:'Standby',Espresso:'Espressobezug',HotWater:'Heißwasser',HotWaterRinse:'Spülen',Steam:'Dampf',SteamRinse:'Dampfspülung',SkipToNext:'Nächster Schritt',Clean:'Reinigung',Descale:'Entkalkung',ShortCal:'Kalibrierung',SelfTest:'Selbsttest',AirPurge:'Entlüften',Refill:'Wasser nachfüllen',FatalError:'Maschinenfehler',FWUpgrade:'Firmware-Update'})[s] ?? (s && !['unknown','unavailable'].includes(s) ? s : '—'); return ''; })()}
        .bubble-sub-button { min-width: 0; height: 32px; padding: 0 9px; border-radius: 9px; background: transparent !important; box-shadow: none; }
        .bubble-sub-button-name-container { color: #e5e5e5 !important; font-size: 13px !important; font-weight: 400 !important; }
        .bubble-sub-button-icon { --mdc-icon-size: 17px; }
        .bubble-sub-button-1 .bubble-sub-button-icon { color: ${hass.states['switch.decent_espresso_de1_de1_on']?.state === 'on' ? '#d98b83' : '#e5e5e5'} !important; }
        .bubble-sub-button-2 .bubble-sub-button-icon { color: ${hass.states['switch.decent_espresso_de1_de1_steam_heater_on']?.state === 'on' ? '#d98b83' : '#e5e5e5'} !important; }
        @media (max-width: 360px) { .bubble-sub-button { padding: 0 6px; } .bubble-icon-container { display: none; } }
      sub_button:
        main:
          - entity: switch.decent_espresso_de1_de1_on
            name: Maschine
            icon: mdi:power
            show_name: true
            show_icon: true
            show_state: false
            show_background: false
            state_background: false
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - entity: switch.decent_espresso_de1_de1_steam_heater_on
            name: Dampf
            icon: mdi:heat-wave
            show_name: true
            show_icon: true
            show_state: false
            show_background: false
            state_background: false
            tap_action:
              action: toggle
            hold_action:
              action: more-info

  - type: conditional
    conditions:
      - condition: state
        entity: switch.socketzigbee_5
        state: 'on'
      - condition: state
        entity: binary_sensor.decent_espresso_de1_de1_machine_connected
        state: 'on'
      - condition: state
        entity: sensor.decent_espresso_de1_de1_state
        state_not: 'Sleep'
    card:
      type: vertical-stack
      cards:
        - type: custom:bubble-card
