      styles: |
        ha-card { --bubble-main-background-color: #202020; --bubble-border-radius: 14px; --bubble-border: none; --bubble-box-shadow: none; }
        .bubble-button-background { opacity: 1 !important; background: #202020 !important; }
        .bubble-button-card-container { min-height: 44px; }
